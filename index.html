<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadline – sewing community prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --head:#4B2D42; --head-line:rgba(255,230,240,.07); --honey:#E3B25F; --honey-ink:#43290F;
  --rose:#C9707D; --rose-soft:#F6E3E6; --sage:#8FA58B;
  --bg:#FBF6F3; --surface:#FFFFFF; --ink:#2F2331; --muted:#76687A; --line:#ECE0E4;
  --chip:#F4EAEE; --focus:#2F6BD0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --head:#2B1B27; --head-line:rgba(255,230,240,.05); --honey:#D1A254; --honey-ink:#2A1A08;
    --rose:#D98C97; --rose-soft:#3A2630; --sage:#7F957C;
    --bg:#1B1519; --surface:#251D23; --ink:#F2E8EE; --muted:#B5A5B1; --line:#3A2E37;
    --chip:#30252D; --focus:#7AAFFF;
  }
}
:root[data-theme="dark"]{
  --head:#2B1B27; --head-line:rgba(255,230,240,.05); --honey:#D1A254; --honey-ink:#2A1A08;
  --rose:#D98C97; --rose-soft:#3A2630; --sage:#7F957C;
  --bg:#1B1519; --surface:#251D23; --ink:#F2E8EE; --muted:#B5A5B1; --line:#3A2E37;
  --chip:#30252D; --focus:#7AAFFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.12;margin:0 0 .4em}
h1{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.55rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:700}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Header */
.top{background-color:var(--head);color:#fff;
  background-image:linear-gradient(var(--head-line) 1px,transparent 1px),linear-gradient(90deg,var(--head-line) 1px,transparent 1px);
  background-size:24px 24px}
.top-inner{max-width:1160px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.45rem;text-decoration:none;letter-spacing:-.02em;margin-right:auto}
.brand .spool{width:34px;height:34px;border-radius:50%;background:var(--honey);display:grid;place-items:center;font-size:1.1rem;box-shadow:inset 0 0 0 3px var(--head),0 0 0 2px var(--honey)}
.tabs{display:flex;gap:4px}
.tabs a{display:flex;align-items:center;gap:6px;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:700;color:rgba(255,255,255,.8)}
.tabs a:hover{background:rgba(255,255,255,.1);color:#fff}
.tabs a.on{background:rgba(255,255,255,.15);color:#fff}
.tape{height:16px;background-color:var(--honey);
  background-image:repeating-linear-gradient(90deg,var(--honey-ink) 0 1px,transparent 1px 12px),repeating-linear-gradient(90deg,var(--honey-ink) 0 2px,transparent 2px 60px);
  background-size:100% 5px,100% 10px;background-repeat:repeat-x;opacity:.95}

.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--chip);color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--honey);color:var(--honey-ink)}
.btn.rose{background:var(--rose);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{padding:6px 13px;font-size:.9rem}

main{max-width:1160px;margin:0 auto;padding:28px 20px 40px}

/* Hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding:34px 36px;margin-bottom:26px;border-radius:24px;background:var(--rose-soft);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:10px;border:2px dashed color-mix(in srgb,var(--rose) 45%,transparent);border-radius:18px;pointer-events:none}
.hero p{color:var(--muted);font-size:1.1rem;max-width:44ch;margin:0 0 20px}
.hero-search{display:flex;gap:8px;background:var(--surface);border-radius:999px;padding:6px;max-width:520px;box-shadow:0 6px 20px rgba(75,45,66,.1)}
.hero-search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:8px 14px}
.hero-search input:focus-visible{outline:none}
.hero-search:focus-within{outline:3px solid var(--focus)}
.stats-inline{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.stats-inline b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem}
.stats-inline span{color:var(--muted);font-size:.92rem}
.collage{position:relative;height:280px}
.collage .tile{position:absolute;width:150px;height:180px;border-radius:14px;box-shadow:0 10px 24px rgba(60,30,50,.18);display:grid;place-items:center;font-size:2.6rem}
.collage .tile::after{content:"";position:absolute;inset:7px;border:2px dashed rgba(255,255,255,.75);border-radius:9px}
.collage .tile::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--rose);box-shadow:0 2px 3px rgba(0,0,0,.25);z-index:1}
.collage .t1{left:4%;top:30px;transform:rotate(-8deg)}
.collage .t2{left:34%;top:0;transform:rotate(4deg);z-index:1}
.collage .t3{left:62%;top:60px;transform:rotate(10deg)}

/* Category chips */
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:16px}
.cat{flex:none;display:flex;align-items:center;gap:8px;font:inherit;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px 8px 10px;cursor:pointer}
.cat .ic{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.cat[aria-pressed="true"]{border-color:var(--head);background:var(--head);color:#fff}
.cat[aria-pressed="true"] .ic{background:rgba(255,255,255,.18)}

/* Sew-along banner */
.sewalong{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:22px 26px;border-radius:20px;background:var(--head);color:#fff;margin:10px 0 34px;position:relative}
.sewalong::before{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,255,255,.22);border-radius:14px;pointer-events:none}
.sewalong .badge{width:72px;height:72px;border-radius:50%;background:var(--honey);color:var(--honey-ink);display:grid;place-items:center;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;line-height:1;font-size:.8rem}
.sewalong .badge b{font-size:1.5rem;display:block}
.sewalong h2{margin:0 0 4px}
.sewalong p{margin:0;color:rgba(255,255,255,.78)}
.progress{height:8px;border-radius:9px;background:rgba(255,255,255,.18);margin-top:10px;max-width:360px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--honey);border-radius:9px}
.sewalong .btn{position:relative}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 16px;flex-wrap:wrap}
.section-head p{margin:0;color:var(--muted)}
.section-head a{font-weight:700;color:var(--rose);text-decoration:none}

.row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:18px;overflow-x:auto;padding-bottom:8px;margin-bottom:34px}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.filters select,dialog input,dialog select,dialog textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.count{color:var(--muted);margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card:hover{border-color:color-mix(in srgb,var(--rose) 55%,var(--line))}
.card a{text-decoration:none}
.media{aspect-ratio:4/5;display:grid;place-items:center;font-size:3.1rem;background-size:cover;background-position:center;position:relative}
.media.swatch::after{content:"";position:absolute;inset:9px;border:2px dashed rgba(255,255,255,.7);border-radius:12px}
.media.swatch{filter:saturate(.8)}
.media span{background:var(--surface);border-radius:50%;width:82px;height:82px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.save-heart{position:absolute;top:12px;right:12px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:1.15rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.save-heart[aria-pressed="true"]{color:#fff;background:var(--rose)}
.ribbon{position:absolute;left:12px;top:12px;z-index:2;background:var(--honey);color:var(--honey-ink);font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:999px}
.card-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:3px;flex:1}
.by{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.9rem}
.mini{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.66rem;font-weight:700;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:9px}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:.8rem}
.tag.lvl-Beginner{background:color-mix(in srgb,var(--sage) 25%,var(--surface))}
.tag.lvl-Intermediate{background:color-mix(in srgb,var(--honey) 28%,var(--surface))}
.tag.lvl-Advanced{background:color-mix(in srgb,var(--rose) 25%,var(--surface))}
.price{font-weight:700}

.detail{display:grid;grid-template-columns:minmax(0,400px) 1fr;gap:36px;margin-bottom:40px}
.detail .media{border-radius:22px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.spec small{display:block;color:var(--muted)}
.spec b{font-size:.98rem}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none;font-weight:700}

.make-notes{color:var(--muted);font-size:.9rem;margin:5px 0 0}
.like{background:none;border:0;font:inherit;cursor:pointer;color:var(--muted);padding:0;align-self:flex-start;margin-top:8px}
.like.on{color:var(--rose);font-weight:700}

.page-intro{margin-bottom:24px;max-width:62ch}
.page-intro p{color:var(--muted);margin:0}
.designer-row{display:flex;gap:16px;align-items:center;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}
.avatar{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.3rem;color:#fff;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--line)}
.designer-row .info{flex:1;min-width:0}
.designer-row p{margin:0;color:var(--muted)}

.empty{padding:28px;text-align:center;background:var(--surface);border:2px dashed var(--line);border-radius:18px;color:var(--muted)}
.stats{display:flex;gap:14px;margin:14px 0 28px;flex-wrap:wrap}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 20px}
.stats b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem}
.stats span{color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:20px}
footer div{max-width:1160px;margin:0 auto;padding:22px 20px;color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

dialog{border:0;border-radius:22px;padding:0;width:min(520px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(45,25,40,.55)}
dialog form{padding:26px;display:flex;flex-direction:column;gap:14px}
dialog label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.95rem}
dialog label small{font-weight:400;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:28px 24px}
  .collage{display:none}
  .detail{grid-template-columns:1fr}
  .detail .media{max-width:340px}
  .sewalong{grid-template-columns:auto 1fr}
  .sewalong .btn{grid-column:1/-1;justify-self:start}
}
@media (max-width:640px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--head);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs a{flex-direction:column;gap:0;font-size:.75rem;padding:6px 2px}
  .tabs .ico{font-size:1.25rem}
  body{padding-bottom:76px}
  #addBtn{padding:8px 13px;font-size:.9rem}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .row-scroll{grid-auto-columns:62%}
  .media span{width:60px;height:60px;font-size:2.2rem}
  .save-heart{width:32px;height:32px;font-size:1rem;top:8px;right:8px}
  .ribbon{left:8px;top:8px}
  .row2{grid-template-columns:1fr}
  .count{margin-left:0;width:100%}
  .toast{bottom:96px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/patterns"><span class="spool" aria-hidden="true">🧵</span>Threadline</a>
    <nav class="tabs" aria-label="Main">
      <a data-r="patterns" href="#/patterns"><span class="ico">📐</span>Patterns</a>
      <a data-r="makes" href="#/makes"><span class="ico">📷</span>Makes</a>
      <a data-r="designers" href="#/designers"><span class="ico">✂️</span>Designers</a>
      <a data-r="me" href="#/me"><span class="ico">🪡</span>My sewing</a>
    </nav>
    <button class="btn primary" id="addBtn">+ Add a make</button>
  </div>
  <div class="tape" aria-hidden="true"></div>
</header>

<main id="app"></main>

<footer><div><span>Threadline test version. Sample patterns and designers are made up.</span><span>Made for sewists 🪡</span></div></footer>

<dialog id="nameDlg">
  <form id="nameForm">
    <h2>Join Threadline</h2>
    <p style="margin:0;color:var(--muted)">Pick a username to save makes, follow designers and build your sewing queue.</p>
    <label>Username <input name="name" required maxlength="24" placeholder="e.g. sewsunny"></label>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button class="btn primary">Join</button>
    </div>
  </form>
</dialog>

<dialog id="makeDlg">
  <form id="makeForm">
    <h2>Add a make</h2>
    <label>Photo <small>Optional. You can add details later.</small>
      <input type="file" name="photo" accept="image/*"></label>
    <label>Pattern <select name="patternId" required></select></label>
    <label>Title <input name="title" required maxlength="60" placeholder="My linen summer version"></label>
    <div class="row2">
      <label>Size made <input name="size" maxlength="20" placeholder="M, or 14"></label>
      <label>Fabric <input name="fabric" maxlength="40" placeholder="Washed linen"></label>
    </div>
    <label>Notes and alterations <textarea name="notes" rows="3" maxlength="400" placeholder="Lengthened by 2 inches, added pockets…"></textarea></label>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button class="btn primary" id="saveMakeBtn">Save make</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Sample data (in the real site this comes from Supabase) ---------- */
const DESIGNERS = [
  {id:"d1",name:"Willow Lane Patterns",bio:"Relaxed everyday basics in sizes XS–4X.",place:"Portland, USA",color:"#9A6FA8"},
  {id:"d2",name:"Studio Marlow",bio:"Workwear-inspired unisex pieces.",place:"Glasgow, UK",color:"#5C84A0"},
  {id:"d3",name:"Hemline House",bio:"Free patterns for first-time sewists.",place:"Melbourne, Australia",color:"#C9707D"},
  {id:"d4",name:"Loom & Needle Co.",bio:"Romantic silhouettes with clear instructions.",place:"Montréal, Canada",color:"#6E9A78"}
];
const sw = (k,c1,c2)=>({k,c1,c2});
const PATTERNS = [
  {id:"p1",name:"Juniper Wrap Dress",d:"d1",type:"Dress",skill:"Beginner",fabric:"Knit",price:14,sizes:"XS–4X",yardage:"2.5–3.5 yd (60\" wide)",notions:"Clear elastic",desc:"A forgiving wrap dress with a tie waist. No zips or buttonholes.",sw:sw("dots","#9A7BC0","#F3EAFB"),isNew:true},
  {id:"p2",name:"Harbor Button-Up",d:"d2",type:"Top",skill:"Intermediate",fabric:"Woven",price:16,sizes:"XS–3X",yardage:"2–2.75 yd (45\" wide)",notions:"8 buttons, interfacing",desc:"A boxy shirt with a two-piece collar and chest pocket.",sw:sw("stripe","#6D93AE","#E6F0F6")},
  {id:"p3",name:"Fern Wide-Leg Trousers",d:"d1",type:"Trousers",skill:"Intermediate",fabric:"Woven",price:15,sizes:"XS–4X",yardage:"2.25–3 yd (54\" wide)",notions:"Invisible zip, hook and eye",desc:"High-waisted trousers with deep pockets and a side zip.",sw:sw("solid","#8FA58B","#8FA58B")},
  {id:"p4",name:"Market Pocket Tote",d:"d3",type:"Bag",skill:"Beginner",fabric:"Woven",price:0,sizes:"One size",yardage:"1 yd (45\" wide)",notions:"None",desc:"A sturdy lined tote. A great first project.",sw:sw("gingham","#D0808C","#FCEEF0")},
  {id:"p5",name:"Maple Raglan Tee",d:"d3",type:"Top",skill:"Beginner",fabric:"Knit",price:0,sizes:"XXS–5X",yardage:"1.25–2 yd (60\" wide)",notions:"None",desc:"A simple raglan tee that works on a regular sewing machine.",sw:sw("stripe","#E3B25F","#FFF5E0")},
  {id:"p6",name:"Cedar Chore Coat",d:"d2",type:"Outerwear",skill:"Advanced",fabric:"Woven",price:20,sizes:"XS–3X",yardage:"3–3.75 yd (54\" wide)",notions:"5 buttons, interfacing",desc:"An unlined chore coat with flat-felled seams and patch pockets.",sw:sw("gingham","#5C6F8A","#E2E8F0")},
  {id:"p7",name:"Linden Midi Skirt",d:"d4",type:"Skirt",skill:"Beginner",fabric:"Woven",price:12,sizes:"XS–4X",yardage:"1.75–2.5 yd (45\" wide)",notions:"1\" elastic",desc:"A gathered elastic-waist skirt with in-seam pockets.",sw:sw("dots","#6E9A78","#E8F3EA")},
  {id:"p8",name:"Aster Tiered Dress",d:"d4",type:"Dress",skill:"Intermediate",fabric:"Woven",price:18,sizes:"XS–4X",yardage:"3.5–4.5 yd (45\" wide)",notions:"Shirring elastic",desc:"A three-tier dress with a shirred bodice and flutter sleeves.",sw:sw("stripe","#C9707D","#FBE6EA"),isNew:true},
  {id:"p9",name:"Birch Wool Coat",d:"d4",type:"Outerwear",skill:"Advanced",fabric:"Woven",price:24,sizes:"XS–3X",yardage:"3.5 yd wool + 2.5 yd lining",notions:"Shoulder pads, 3 buttons",desc:"A fully lined, tailored coat with a notched collar.",sw:sw("solid","#A58AA8","#A58AA8")}
];
const SEED_MAKES = [
  {id:"m1",user:"sewsunny",patternId:"p1",title:"Sunday wrap dress",size:"M",fabric:"Rayon jersey",notes:"Lengthened the skirt by 2 inches.",likes:24,sw:sw("dots","#6D93AE","#E6F0F6")},
  {id:"m2",user:"bobbinbee",patternId:"p5",title:"Striped raglan",size:"2X",fabric:"Cotton-spandex",notes:"Sized down one at the neckband.",likes:17,sw:sw("stripe","#4B2D42","#F4EAEE")},
  {id:"m3",user:"marta.makes",patternId:"p3",title:"Linen Fern trousers",size:"14",fabric:"Washed linen",notes:"Took 1\" off the rise, added belt loops.",likes:41,sw:sw("solid","#D9B98F","#D9B98F")},
  {id:"m4",user:"sewsunny",patternId:"p4",title:"Farmers market tote",size:"",fabric:"Canvas",notes:"Made in one afternoon.",likes:9,sw:sw("gingham","#8FA58B","#EDF3EC")},
  {id:"m5",user:"threadandtea",patternId:"p8",title:"Garden party Aster",size:"L",fabric:"Cotton lawn",notes:"Added a fourth tier.",likes:56,sw:sw("dots","#C9707D","#FFF0F2")},
  {id:"m6",user:"bobbinbee",patternId:"p6",title:"Corduroy chore coat",size:"XL",fabric:"Wide-wale corduroy",notes:"Full bicep adjustment, lined the pockets.",likes:33,sw:sw("stripe","#A58AA8","#EFE6F0")},
  {id:"m7",user:"threadandtea",patternId:"p7",title:"Cherry print Linden",size:"S",fabric:"Cotton poplin",notes:"Doubled the elastic channel.",likes:28,sw:sw("dots","#D0808C","#FFFFFF")}
];
const ICON = {Dress:"👗",Top:"👚",Trousers:"👖",Skirt:"🪡",Outerwear:"🧥",Bag:"👜"};
const CAT_LABEL = {Dress:"Dresses",Top:"Tops",Trousers:"Trousers",Skirt:"Skirts",Outerwear:"Coats",Bag:"Bags"};

/* ---------- State, saved in this browser ---------- */
const KEY = "threadline-demo-v1";
let state = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.makes) return s; }catch(e){}
  return {user:null, makes:[], saved:[], following:[], liked:[], sewalong:false};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }catch(e){ return false; } }
const allMakes = ()=> [...state.makes, ...SEED_MAKES];
const pat = id => PATTERNS.find(p=>p.id===id);
const des = id => DESIGNERS.find(d=>d.id===id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function swatchCss(s){
  if(s.k==="stripe") return `background-image:repeating-linear-gradient(45deg,${s.c1} 0 14px,${s.c2} 14px 28px)`;
  if(s.k==="dots") return `background-color:${s.c2};background-image:radial-gradient(${s.c1} 22%,transparent 23%);background-size:22px 22px`;
  if(s.k==="gingham") return `background-color:${s.c2};background-image:linear-gradient(90deg,${s.c1}88 50%,transparent 50%),linear-gradient(${s.c1}88 50%,transparent 50%);background-size:28px 28px`;
  return `background-color:${s.c1}`;
}
function media(item, type){
  if(item.photo) return `<div class="media" style="background-image:url('${item.photo}')" role="img" aria-label="${esc(item.title)}"></div>`;
  return `<div class="media swatch" style="${swatchCss(item.sw)}" aria-hidden="true"><span>${ICON[type]}</span></div>`;
}
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
let pendingAfterJoin = null;
function requireUser(then){ if(state.user) return then(); pendingAfterJoin = then; document.getElementById("nameDlg").showModal(); }

function patternCard(p){
  const d = des(p.d); const n = allMakes().filter(m=>m.patternId===p.id).length;
  const saved = state.saved.includes(p.id);
  return `<div class="card">
    ${p.isNew?`<span class="ribbon">New</span>`:""}
    <button class="save-heart" data-save="${p.id}" aria-pressed="${saved}" aria-label="${saved?"Remove from":"Add to"} sewing queue">${saved?"♥":"♡"}</button>
    <a href="#/pattern/${p.id}">${media(p,p.type)}</a>
    <div class="card-body">
      <h3><a href="#/pattern/${p.id}">${esc(p.name)}</a></h3>
      <div class="by"><span class="mini" style="background:${d.color}">${d.name[0]}</span>${esc(d.name)}</div>
      <div class="tags"><span class="tag price">${p.price?"$"+p.price:"Free"}</span><span class="tag lvl-${p.skill}">${p.skill}</span><span class="tag">${p.fabric}</span><span class="tag">${n} ${n===1?"make":"makes"}</span></div>
    </div></div>`;
}
function makeCard(m){
  const p = pat(m.patternId); const liked = state.liked.includes(m.id);
  const likes = (m.likes||0) + (liked?1:0);
  return `<div class="card">
    <a href="#/pattern/${p.id}">${media(m,p.type)}</a>
    <div class="card-body">
      <h3>${esc(m.title)}</h3>
      <div class="by">@${esc(m.user)} made <a href="#/pattern/${p.id}" style="text-decoration:underline">${esc(p.name)}</a></div>
      ${m.size||m.fabric ? `<div class="tags">${m.size?`<span class="tag">Size ${esc(m.size)}</span>`:""}${m.fabric?`<span class="tag">${esc(m.fabric)}</span>`:""}</div>`:""}
      ${m.notes?`<p class="make-notes">${esc(m.notes)}</p>`:""}
      <button class="like ${liked?"on":""}" data-like="${m.id}" aria-pressed="${liked}">${liked?"♥":"♡"} ${likes}</button>
    </div></div>`;
}

/* ---------- Views ---------- */
const filters = {q:"",type:"",skill:"",fabric:"",price:""};
function viewPatterns(){
  const opt = (arr,sel)=>arr.map(v=>`<option ${sel===v?"selected":""}>${v}</option>`).join("");
  const trending = [...allMakes()].sort((a,b)=>(b.likes||0)-(a.likes||0)).slice(0,5);
  const joined = state.sewalong; const count = 142 + (joined?1:0);
  return `
  <section class="hero">
    <div>
      <h1>Sew something you'll love</h1>
      <p>Find patterns from independent designers, see how they look on real sewists, and share what you make.</p>
      <div class="hero-search" role="search">
        <input id="fq" type="search" placeholder="Try “wrap dress” or “beginner”" value="${esc(filters.q)}" aria-label="Search patterns">
        <button class="btn primary" id="searchBtn">Search</button>
      </div>
      <div class="stats-inline">
        <div><b>${PATTERNS.length}</b><span>patterns</span></div>
        <div><b>${DESIGNERS.length}</b><span>designers</span></div>
        <div><b>${allMakes().length}</b><span>makes shared</span></div>
      </div>
    </div>
    <div class="collage" aria-hidden="true">
      <div class="tile t1" style="${swatchCss(PATTERNS[3].sw)}"><span>👜</span></div>
      <div class="tile t2" style="${swatchCss(PATTERNS[0].sw)}"><span>👗</span></div>
      <div class="tile t3" style="${swatchCss(PATTERNS[4].sw)}"><span>👚</span></div>
    </div>
  </section>

  <div class="sewalong">
    <div class="badge"><div><b>Sep</b>sew-along</div></div>
    <div>
      <h2>Linden Skirt sew-along</h2>
      <p>Sew along with ${count} others this month. New tips every Monday, and makes are shared on Friday.</p>
      <div class="progress" aria-label="Month progress"><i style="width:55%"></i></div>
    </div>
    <button class="btn ${joined?"ghost":"primary"}" data-sewalong style="${joined?"color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)":""}">${joined?"✓ You've joined":"Join the sew-along"}</button>
  </div>

  <div class="section-head"><h2>Trending makes</h2><a href="#/makes">See all makes</a></div>
  <div class="row-scroll">${trending.map(makeCard).join("")}</div>

  <div class="section-head"><h2>Browse patterns</h2></div>
  <div class="cats" role="group" aria-label="Garment type">
    <button class="cat" data-cat="" aria-pressed="${!filters.type}"><span class="ic">✨</span>All</button>
    ${Object.keys(ICON).map(t=>`<button class="cat" data-cat="${t}" aria-pressed="${filters.type===t}"><span class="ic">${ICON[t]}</span>${CAT_LABEL[t]}</button>`).join("")}
  </div>
  <div class="filters">
    <select id="fskill" aria-label="Skill level"><option value="">Any skill level</option>${opt(["Beginner","Intermediate","Advanced"],filters.skill)}</select>
    <select id="ffabric" aria-label="Fabric type"><option value="">Knit or woven</option>${opt(["Knit","Woven"],filters.fabric)}</select>
    <select id="fprice" aria-label="Price"><option value="">Free and paid</option><option value="free" ${filters.price==="free"?"selected":""}>Free only</option><option value="paid" ${filters.price==="paid"?"selected":""}>Paid only</option></select>
    <span class="count" id="pcount"></span>
  </div>
  <div id="presults"></div>`;
}
function renderPatternResults(){
  const q = filters.q.toLowerCase().trim();
  const list = PATTERNS.filter(p =>
    (!q || (p.name+" "+des(p.d).name+" "+p.type+" "+p.skill+" "+p.fabric).toLowerCase().includes(q)) &&
    (!filters.type || p.type===filters.type) &&
    (!filters.skill || p.skill===filters.skill) &&
    (!filters.fabric || p.fabric===filters.fabric) &&
    (!filters.price || (filters.price==="free" ? !p.price : p.price>0)));
  const box = document.getElementById("presults"); if(!box) return;
  document.getElementById("pcount").textContent = `${list.length} pattern${list.length===1?"":"s"}`;
  document.querySelectorAll(".cat").forEach(c=>c.setAttribute("aria-pressed", c.dataset.cat===filters.type));
  box.innerHTML = list.length ? `<div class="grid">${list.map(patternCard).join("")}</div>`
    : `<div class="empty">No patterns match these filters. Try removing one.</div>`;
}
function viewPattern(id){
  const p = pat(id); if(!p) return `<div class="empty">This pattern doesn't exist. <a href="#/patterns">Browse patterns</a></div>`;
  const d = des(p.d); const makes = allMakes().filter(m=>m.patternId===id);
  const saved = state.saved.includes(id);
  return `<a class="back" href="#/patterns">← All patterns</a>
  <div class="detail">
    ${media(p,p.type)}
    <div>
      <h1>${esc(p.name)}</h1>
      <div class="by" style="font-size:1rem"><span class="mini" style="background:${d.color};width:26px;height:26px;font-size:.8rem">${d.name[0]}</span><a href="#/designer/${d.id}"><b>${esc(d.name)}</b></a></div>
      <p style="font-size:1.08rem">${esc(p.desc)}</p>
      <div class="specs">
        <div class="spec"><small>Skill level</small><b>${p.skill}</b></div>
        <div class="spec"><small>Fabric</small><b>${p.fabric}</b></div>
        <div class="spec"><small>Sizes</small><b>${p.sizes}</b></div>
        <div class="spec"><small>Yardage</small><b>${p.yardage}</b></div>
        <div class="spec"><small>Notions</small><b>${p.notions}</b></div>
        <div class="spec"><small>Price</small><b>${p.price?"$"+p.price:"Free"}</b></div>
      </div>
      <div class="actions">
        <button class="btn primary" data-buy="${p.id}">${p.price?`Buy PDF for $${p.price}`:"Download free PDF"}</button>
        <button class="btn ghost" data-save="${p.id}" aria-pressed="${saved}">${saved?"♥ In your queue":"♡ Add to sewing queue"}</button>
      </div>
    </div>
  </div>
  <div class="section-head"><h2>Makes of this pattern (${makes.length})</h2><button class="btn small rose" data-addfor="${p.id}">+ Add your make</button></div>
  ${makes.length?`<div class="grid">${makes.map(makeCard).join("")}</div>`:`<div class="empty">Nobody has shared a make yet. Be the first.</div>`}`;
}
function viewMakes(){
  return `<div class="page-intro"><h1>Latest makes</h1><p>Finished projects from the community, with the size, fabric and changes each sewist used.</p></div>
  <div class="grid">${allMakes().map(makeCard).join("")}</div>`;
}
function designerRow(d){
  const f = state.following.includes(d.id); const n = PATTERNS.filter(p=>p.d===d.id).length;
  return `<div class="designer-row">
    <div class="avatar" style="background:${d.color}">${d.name[0]}</div>
    <div class="info"><h3><a href="#/designer/${d.id}">${esc(d.name)}</a></h3><p>${esc(d.bio)} ${n} patterns, ${esc(d.place)}.</p></div>
    <button class="btn small ${f?"ghost":"primary"}" data-follow="${d.id}" aria-pressed="${f}">${f?"Following":"Follow"}</button>
  </div>`;
}
function viewDesigners(){
  return `<div class="page-intro"><h1>Designers</h1><p>Follow designers to hear about new releases and pattern tests.</p></div>${DESIGNERS.map(designerRow).join("")}`;
}
function viewDesigner(id){
  const d = des(id); if(!d) return `<div class="empty">Designer not found.</div>`;
  return `<a class="back" href="#/designers">← All designers</a>${designerRow(d)}
  <h2 style="margin-top:24px">Patterns</h2><div class="grid">${PATTERNS.filter(p=>p.d===id).map(patternCard).join("")}</div>`;
}
function viewMe(){
  if(!state.user) return `<div class="empty"><h2>Your sewing space</h2><p>Keep your makes, sewing queue and favorite designers in one place.</p><button class="btn primary" id="joinBtn">Join Threadline</button></div>`;
  const mine = state.makes.filter(m=>m.user===state.user);
  const queue = state.saved.map(pat).filter(Boolean);
  const follows = state.following.map(des).filter(Boolean);
  return `<h1>Hi, @${esc(state.user)}</h1>
  <div class="stats"><div><b>${mine.length}</b><span>makes</span></div><div><b>${queue.length}</b><span>in queue</span></div><div><b>${follows.length}</b><span>following</span></div></div>
  <div class="section-head"><h2>My makes</h2><button class="btn small rose" data-addfor="">+ Add a make</button></div>
  ${mine.length?`<div class="grid">${mine.map(makeCard).join("")}</div>`:`<div class="empty">You haven't added a make yet. Share something you've sewn, even a quick tote.</div>`}
  <h2 style="margin-top:34px">Sewing queue</h2>
  ${queue.length?`<div class="grid">${queue.map(patternCard).join("")}</div>`:`<div class="empty">Tap the ♡ on a pattern to save it here. <a href="#/patterns">Browse patterns</a></div>`}
  <h2 style="margin-top:34px">Following</h2>
  ${follows.length?follows.map(designerRow).join(""):`<div class="empty">Follow designers to see their new patterns. <a href="#/designers">See designers</a></div>`}
  <p style="margin-top:36px;color:var(--muted);font-size:.9rem">This is a test version. Your data is saved only in this browser. <button class="btn small ghost" id="resetBtn">Reset demo data</button></p>`;
}

/* ---------- Router ---------- */
function render(){
  const [, route="patterns", id] = (location.hash || "#/patterns").split("/");
  const views = {patterns:viewPatterns, pattern:()=>viewPattern(id), makes:viewMakes, designers:viewDesigners, designer:()=>viewDesigner(id), me:viewMe};
  document.getElementById("app").innerHTML = (views[route] || viewPatterns)();
  const tabFor = {pattern:"patterns", designer:"designers"}[route] || route;
  document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on", a.dataset.r===tabFor));
  if(route==="patterns" || !views[route]) renderPatternResults();
}
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });

/* ---------- Events ---------- */
document.getElementById("app").addEventListener("input", e=>{
  const map = {fq:"q",fskill:"skill",ffabric:"fabric",fprice:"price"};
  if(map[e.target.id]){ filters[map[e.target.id]] = e.target.value; renderPatternResults(); }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.close!==undefined){ t.closest("dialog").close(); return; }
  if(t.dataset.cat!==undefined){ filters.type = t.dataset.cat; renderPatternResults(); return; }
  if(t.id==="searchBtn"){ document.getElementById("presults").scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(t.dataset.like){ requireUser(()=>{ const i=state.liked.indexOf(t.dataset.like); i<0?state.liked.push(t.dataset.like):state.liked.splice(i,1); save(); render(); }); }
  if(t.dataset.save){ requireUser(()=>{ const id=t.dataset.save, i=state.saved.indexOf(id); if(i<0){state.saved.push(id);toast("Added to your sewing queue");}else{state.saved.splice(i,1);toast("Removed from your queue");} save(); const y=scrollY; render(); scrollTo(0,y); }); }
  if(t.dataset.follow){ requireUser(()=>{ const id=t.dataset.follow, i=state.following.indexOf(id); if(i<0){state.following.push(id);toast("Following "+des(id).name);}else{state.following.splice(i,1);} save(); render(); }); }
  if(t.dataset.sewalong!==undefined){ requireUser(()=>{ state.sewalong=!state.sewalong; save(); toast(state.sewalong?"You've joined the sew-along":"You left the sew-along"); const y=scrollY; render(); scrollTo(0,y); }); }
  if(t.dataset.buy){ const p=pat(t.dataset.buy); toast(p.price?"Checkout isn't connected in this test version":"Downloads aren't connected in this test version"); }
  if(t.dataset.addfor!==undefined){ openMake(t.dataset.addfor); }
  if(t.id==="joinBtn"){ requireUser(render); }
  if(t.id==="resetBtn"){ if(confirm("Delete your demo makes, queue and follows?")){ try{localStorage.removeItem(KEY);}catch(err){} state=load(); render(); } }
});
document.getElementById("addBtn").addEventListener("click", ()=>openMake(""));

document.getElementById("nameForm").addEventListener("submit", e=>{
  e.preventDefault();
  const name = e.target.name.value.trim().replace(/\s+/g,"").slice(0,24); if(!name) return;
  state.user = name; save(); e.target.closest("dialog").close(); e.target.reset();
  toast("Welcome, @"+name);
  const fn = pendingAfterJoin; pendingAfterJoin = null; fn ? fn() : render();
});

function openMake(patternId){
  requireUser(()=>{
    const f = document.getElementById("makeForm");
    f.patternId.innerHTML = `<option value="">Choose a pattern</option>` + PATTERNS.map(p=>`<option value="${p.id}" ${p.id===patternId?"selected":""}>${esc(p.name)} (${esc(des(p.d).name)})</option>`).join("");
    document.getElementById("makeDlg").showModal();
  });
}
function resizeImage(file){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const s=Math.min(1,700/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.75)); };
    img.onerror = rej; img.src = url;
  });
}
const PALETTE = [sw("dots","#6D93AE","#E6F0F6"),sw("stripe","#C9707D","#FBE6EA"),sw("gingham","#8FA58B","#EDF3EC"),sw("solid","#A58AA8","#A58AA8"),sw("stripe","#E3B25F","#FFF5E0")];
document.getElementById("makeForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const f = e.target, btn = document.getElementById("saveMakeBtn");
  btn.disabled = true; btn.textContent = "Saving…";
  let photo = null;
  if(f.photo.files[0]){ try{ photo = await resizeImage(f.photo.files[0]); }catch(err){ toast("That photo couldn't be read. Saved without it."); } }
  const make = {id:"u"+Date.now(), user:state.user, patternId:f.patternId.value, title:f.title.value.trim(), size:f.size.value.trim(), fabric:f.fabric.value.trim(), notes:f.notes.value.trim(), likes:0, photo, sw:PALETTE[Math.floor(Math.random()*PALETTE.length)]};
  state.makes.unshift(make);
  if(!save()){ make.photo = null; if(!save()){ state.makes.shift(); toast("Storage is full. Reset demo data to add more."); } else toast("Saved without the photo: browser storage is full"); }
  else toast("Make saved");
  btn.disabled = false; btn.textContent = "Save make";
  f.reset(); document.getElementById("makeDlg").close();
  location.hash = "#/pattern/"+make.patternId; render();
});

render();
</script>
</body>
</html>
